<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Lead Shop</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7fb; color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
      .card { max-width: 360px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 28px; text-align: center; }
      h1 { font-size: 20px; margin: 8px 0 4px; }
      p { color: #64748b; font-size: 14px; }
      button { margin-top: 12px; background: #2453e0; color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 44px">📶</div>
      <h1>You're offline</h1>
      <p>Lead Shop needs a connection for this page. Pages you've opened before still work offline.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
